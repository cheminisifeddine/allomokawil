name: Android release APK

# Manual only, deliberately.
#
# This workflow used to also fire on `push: tags`, so creating a release tag
# started a CI build of the same commit at the same moment as the local
# digest-verifying publisher. Two writers, one release, and `gh release upload
# --clobber` means the last one wins: the v1.0.6 assets ended up being CI's
# bytes, not the bytes the publisher had just hashed and verified. Run this by
# hand when you want a clean-machine build as an independent check; the release
# assets are owned by tools/publish_release.py.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APKs to"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs (per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://allomokawil.colisify.com \
            --dart-define=API_FALLBACK_URL=https://finili.medsaidkichene.workers.dev

      # Stage the two shipping ABIs under the stable asset names the worker
      # download route redirects to
      #   /download/allomokawil.apk -> releases/latest/download/allomokawil-arm64.apk
      # The x86_64 build is emulator-only and is deliberately not published.
      - name: Stage APKs under the stable asset names
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/allomokawil-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/allomokawil-v7a.apk
          ls -la dist/
          sha256sum dist/*.apk

      # `gh release upload` only adds assets. It must not be
      # softprops/action-gh-release with a name/body: that step rewrote the
      # release name and notes on every tag, replacing the deploy script's
      # version notes with a stale body that still carried the old app name.
      - name: Attach APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "الو مقاول $TAG" --generate-notes
          gh release upload "$TAG" dist/allomokawil-arm64.apk dist/allomokawil-v7a.apk --clobber

      - name: Release asset list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
