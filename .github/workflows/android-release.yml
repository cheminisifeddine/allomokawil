name: Android release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APKs to"
        required: true
        default: "v1.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs (per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://allomokawil.colisify.com \
            --dart-define=API_FALLBACK_URL=https://finili.medsaidkichene.workers.dev

      - name: Show artifacts
        run: |
          ls -la build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/*.apk

      - name: Attach APKs to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Allo Mokawil — Android (network fix build)"
          body: |
            الو موكاول — Android build.

            The previous APK could not resolve DNS: the release manifest was missing the
            INTERNET permission (Flutter only injects it into debug/profile manifests). Fixed.

            - `allomokawil-arm64-v8a-*.apk` → most phones (64-bit, Android 7+)
            - `allomokawil-armeabi-v7a-*.apk` → older 32-bit phones

            Install: allow "install from unknown sources" for your browser/file manager.
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true
