# A Gradle heap larger than the machine's RAM gets the build OOM-killed, and
# 8G/4G is larger than most laptops and CI runners (GitHub's ubuntu runner has
# 7 GB, and this VPS has 7.8 GB with no swap). Gradle only ever grows toward
# the cap when something leaks, so a generous-but-realistic ceiling builds the
# same APK and fails loudly instead of dying by SIGKILL.
#
# v1.4.0 added geolocator + geocoding (and their platform modules), which pushed
# a release build past this ceiling: `Gradle task assembleRelease failed with
# exit code 143` after 31 minutes. Two changes fix the peak, and both matter:
#
#   1. the Kotlin compile runs IN-PROCESS. The separate Kotlin daemon is a second
#      JVM that holds its own 512 MB-1 GB and is not counted in org.gradle.jvmargs;
#      with it, the box's total went over RAM and the kernel chose the victim.
#   2. the ceilings are lower again, so Gradle + AAPT2 + R8 + the Dart VM fit in
#      what is actually free rather than what we wish were free.
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx384m
# Dexing and AAPT2 each fork workers; capping them keeps peak RSS predictable
# on a small builder where the Dart VM and the Gradle daemon already coexist.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
