name: allomokawil
description: Allo Mokawil — Algerian home-design & renovation marketplace (Houzz-style).
publish_to: 'none'
version: 1.5.0+24

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  intl: any
  geolocator: ^14.0.3
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # All 58 wilayas and their 1,541 communes, generated by
    # tool/gen_communes.py. Bundled so the picker opens offline.
    - assets/data/communes_dz.json
    # The brand mark, used in the landing hero and the auth header.
    - assets/brand/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700